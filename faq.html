  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lor:rgba(233,192,188,0.45);\">02<\u002Fspan><\u002Fa>\n          <a href=\"media.html\" style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:19px 2px;border-bottom:1px solid rgba(255,255,255,0.09);color:#FFFFFF;font-size:23px;font-weight:500;letter-spacing:0.01em;\" style-hover=\"color:#E9C0BC;\"><span>מדיה<\u002Fspan><span style=\"font-size:11px;letter-spacing:0.18em;color:rgba(233,192,188,0.45);\">03<\u002Fspan><\u002Fa>\n          <a href=\"faq.html\" style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:19px 2px;border-bottom:1px solid rgba(255,255,255,0.09);color:#FFFFFF;font-size:23px;font-weight:500;letter-spacing:0.01em;\" style-hover=\"color:#E9C0BC;\"><span>שאלות ותשובות<\u002Fspan><span style=\"font-size:11px;letter-spacing:0.18em;color:rgba(233,192,188,0.45);\">04<\u002Fspan><\u002Fa>\n          <a href=\"contact.html\" style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:19px 2px;border-bottom:1px solid rgba(255,255,255,0.09);color:#FFFFFF;font-size:23px;font-weight:500;letter-spacing:0.01em;\" style-hover=\"color:#E9C0BC;\"><span>צור קשר<\u002Fspan><span style=\"font-size:11px;letter-spacing:0.18em;color:rgba(233,192,188,0.45);\">05<\u002Fspan><\u002Fa>\n        <\u002Fnav>\n        <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:14px;padding:26px 6% calc(26px + env(safe-area-inset-bottom));\">\n          <a href=\"https://wa.me/972508284019\" style=\"background:#7C3F43;color:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:700;letter-spacing:0.02em;padding:16px;border-radius:32px;\"><svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2.2-5.5A8.4 8.4 0 1 1 21 11.5z\"><\u002Fpath><\u002Fsvg><span>שלחו הודעה בוואטסאפ<\u002Fspan><\u002Fa>\n          <a href=\"tel:0508284019\" style=\"text-align:center;color:rgba(255,255,255,0.6);font-size:13.5px;letter-spacing:0.1em;\">050-828-4019<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"position:relative;isolation:isolate;min-height:clamp(400px,58vh,580px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(110px,20vw,150px) 6% clamp(56px,9vw,84px);overflow:hidden;\">\n    <img src=\"ad658c94-09e9-418b-833d-9d28d6cd8787\" alt=\"באקו\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;\">\n    <div style=\"position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(14,11,12,0.62),rgba(14,11,12,0.72));\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(165,100,102,0.3),rgba(110,60,64,0.34));mix-blend-mode:multiply;\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px;\">\n      <div style=\"width:6px;height:6px;transform:rotate(45deg);background:#E9C0BC;\"><\u002Fdiv>\n      <div style=\"width:46px;height:1px;background:rgba(233,192,188,0.6);\"><\u002Fdiv>\n      <div style=\"color:#E9C0BC;letter-spacing:0.3em;font-size:12.5px;\">שאלות נפוצות<\u002Fdiv>\n      <div style=\"width:46px;height:1px;background:rgba(233,192,188,0.6);\"><\u002Fdiv>\n      <div style=\"width:6px;height:6px;transform:rotate(45deg);background:#E9C0BC;\"><\u002Fdiv>\n    <\u002Fdiv>\n    <h1 style=\"font-family:'FUP Golan',sans-serif;font-weight:500;font-size:clamp(32px,5.4vw,60px);line-height:1.12;color:#FFFFFF;margin:0;text-wrap:balance;\">כל מה שרציתם לדעת<\u002Fh1>\n    <div style=\"font-family:'Parisienne',cursive;font-size:clamp(32px,4vw,48px);line-height:1.1;color:#E9C0BC;margin:8px 0 20px;\">Miami Residence<\u002Fdiv>\n    <p style=\"font-size:clamp(15px,1.6vw,18px);line-height:1.85;color:rgba(255,255,255,0.88);margin:0 auto;max-width:56ch;text-wrap:pretty;\">תהליך הרכישה, תנאי התשלום, האזור והעיר: התשובות לשאלות שהכי חוזרות אצלנו.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:32px;\">\n      <a href=\"#faq\" style=\"background:#7C3F43;color:#FFFFFF;padding:15px 34px;font-size:14.5px;font-weight:700;letter-spacing:0.04em;border-radius:26px;box-shadow:0 12px 30px rgba(0,0,0,0.3);\">לשאלות<\u002Fa>\n      <a href=\"contact.html\" style=\"border:1px solid rgba(255,255,255,0.7);color:#FFFFFF;padding:15px 34px;font-size:14.5px;letter-spacing:0.04em;border-radius:26px;transition:background 0.3s ease;\" style-hover=\"background:rgba(255,255,255,0.14);\">דברו איתנו<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"faq\" style=\"background:#FFFFFF;padding:clamp(56px,10vw,110px) 6%;\">\n    <div style=\"text-align:center;max-width:760px;margin:0 auto 34px;\">\n      <div style=\"display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px;\">\n        <div style=\"width:38px;height:1px;background:rgba(140,74,78,0.5);\"><\u002Fdiv>\n        <div style=\"color:#8C4A4E;letter-spacing:0.3em;font-size:12px;\">שאלתם, ענינו<\u002Fdiv>\n        <div style=\"width:38px;height:1px;background:rgba(140,74,78,0.5);\"><\u002Fdiv>\n      <\u002Fdiv>\n      <h2 style=\"font-family:'FUP Golan',sans-serif;font-weight:500;font-size:clamp(28px,3.8vw,46px);color:#141414;margin:0 0 14px;text-wrap:balance;\">בחרו נושא<\u002Fh2>\n      <p style=\"color:#6B6058;font-size:15.5px;line-height:1.8;margin:0;\">הפרויקט, אזור Sea Breeze והעיר באקו.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:36px;\">\n      <sc-for list=\"{{ topics }}\" as=\"tp\" hint-placeholder-count=\"3\">\n        <button onclick=\"{{ tp.select }}\" style=\"background:{{ tp.bg }};color:{{ tp.color }};border:1px solid {{ tp.border }};font-family:'FUP Golan',sans-serif;font-size:14px;font-weight:600;padding:12px 26px;border-radius:22px;cursor:pointer;min-height:44px;transition:background 0.3s ease,color 0.3s ease;\">{{ tp.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"max-width:860px;margin:0 auto;display:flex;flex-direction:column;border-top:1px solid rgba(20,20,20,0.1);\">\n      <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"6\">\n        <div style=\"border-bottom:1px solid rgba(20,20,20,0.1);\">\n          <div onclick=\"{{ f.toggle }}\" style=\"display:flex;align-items:center;justify-content:space-between;padding:22px 4px;cursor:pointer;gap:20px;min-height:44px;\">\n            <div style=\"font-size:17px;font-weight:500;color:#141414;text-wrap:pretty;\">{{ f.q }}<\u002Fdiv>\n            <div style=\"width:30px;height:30px;border-radius:50%;background:{{ f.signBg }};color:{{ f.signColor }};display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:background 0.3s ease;\">{{ f.sign }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:0 4px 26px;font-size:15.5px;line-height:1.9;color:#4A4345;max-width:70ch;text-wrap:pretty;\">{{ f.a }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#F3ECE7;border-top:1px solid rgba(20,20,20,0.08);padding:clamp(48px,8vw,84px) 6%;text-align:center;\">\n    <h2 style=\"font-family:'FUP Golan',sans-serif;font-weight:500;font-size:clamp(24px,3.2vw,40px);color:#141414;margin:0 0 14px;text-wrap:balance;\">לא מצאתם תשובה?<\u002Fh2>\n    <p style=\"color:#4A4345;font-size:15.5px;line-height:1.8;margin:0 auto 28px;max-width:52ch;\">השאירו פרטים ונציג הפרויקט יחזור אליכם עם כל המידע.<\u002Fp>\n    <a href=\"contact.html\" style=\"display:inline-block;background:#7C3F43;color:#FFFFFF;padding:15px 36px;font-size:14.5px;font-weight:700;letter-spacing:0.04em;border-radius:26px;\">דברו איתנו<\u002Fa>\n  <\u002Fdiv>\n\n  <div style=\"background:#0A0A0A;padding:50px 6% 34px;display:flex;flex-direction:column;align-items:center;gap:22px;border-top:1px solid rgba(181,103,107,0.2);\">\n    <img src=\"d06e4774-3e77-44ba-9bc7-cdb86cc84aa5\" alt=\"Miami Residence\" style=\"height:30px;width:auto;object-fit:contain;display:block;\">\n    <div style=\"display:flex;gap:8px 24px;flex-wrap:wrap;justify-content:center;\">\n      <a href=\"index.html\" style=\"color:#9C8688;font-size:13px;padding:8px 4px;\">בית<\u002Fa>\n      <a href=\"about.html\" style=\"color:#9C8688;font-size:13px;padding:8px 4px;\">אודות<\u002Fa>\n      <a href=\"media.html\" style=\"color:#9C8688;font-size:13px;padding:8px 4px;\">מדיה<\u002Fa>\n      <a href=\"faq.html\" style=\"color:#9C8688;font-size:13px;padding:8px 4px;\">שאלות ותשובות<\u002Fa>\n      <a href=\"contact.html\" style=\"color:#9C8688;font-size:13px;padding:8px 4px;\">צור קשר<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;color:#5E574C;\">© מיאמי רזידנס · Sea Breeze, Baku. כל הזכויות שמורות.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst LISTS = [\n  [\n    {q:'כמה עולה דירה בפרויקט?', a:'מחירי הדירות משתנים בהתאם לגודל, לקומה ולמפרט. השאירו פרטים ונשלח הצעת מחיר מדויקת ומצגת מלאה.'},\n    {q:'האם מלווים אותנו עורכי דין בתהליך הרכישה?', a:'כן, הרכישה מלווה בייעוץ משפטי מקצועי בכל שלב, מתחילת ההתקשרות ועד למסירת הנכס.'},\n    {q:'איך מתנהל תהליך הרכישה?', a:'יצירת קשר וליווי אישי, קבלת מצגת ותנאים, חתימה על הסכם, תשלומים לפי אבני דרך ולבסוף מסירת הנכס.'},\n    {q:'מה תנאי התשלום?', a:'30% מקדמה בעת החתימה, 55% לפי התקדמות הפרויקט (שלד, מערכות, גמר) ו-15% בעת קבלת המפתח.'},\n    {q:'מה המרחק בין הפרויקט לחוף הים?', a:'הפרויקט ממוקם בקו ראשון לים באזור Sea Breeze, עם גישה ישירה לחוף.'},\n    {q:'מתי מתבצעת מסירת הדירות?', a:'מועדי המסירה נקבעים לפי לוחות הזמנים של הפרויקט ומועברים לרוכשים בפגישת הייעוץ האישית.'},\n    {q:'אילו סוגי דירות יש בפרויקט?', a:'הפרויקט כולל מגוון טיפוסים, מדירות סטודיו ועד דירות משפחתיות גדולות, חלקן עם מרפסות פנורמיות ונוף פתוח לים.'},\n    {q:'מה כלול במפרט הדירה?', a:'מפרט מלא הכולל מטבח מאובזר, מיזוג, ריצוף וכלים סניטריים באיכות גבוהה. המפרט המדויק נמסר יחד עם הצעת המחיר.'},\n    {q:'מה כולל שטח הפרויקט מעבר לדירות?', a:'בריכות ופארק מים, חוף פרטי, חדר כושר, ספא, לובי מאויש, קונסיירז׳, חניה ושטחי מסחר בתוך המתחם.'},\n    {q:'האם יש דמי ניהול ותחזוקה?', a:'כן, דמי ניהול חודשיים המכסים את אחזקת השטחים המשותפים, האבטחה והמתקנים. הסכום נמסר בשקיפות מלאה לפני החתימה.'},\n    {q:'האם אפשר להשכיר את הדירה?', a:'בהחלט. האזור מבוקש להשכרה קצרת וארוכת טווח, וניתן להיעזר בשירותי ניהול השכרה מקומיים.'},\n    {q:'מה קורה אם אני רוצה למכור את הדירה בהמשך?', a:'ניתן למכור את הנכס בכל שלב בהתאם לתנאי ההסכם; אנחנו מלווים גם בתהליכי מכירה חוזרת.'},\n    {q:'האם אפשר לראות את הפרויקט פיזית?', a:'כן, אנחנו מארגנים סיורי רוכשים בבאקו, כולל ביקור באתר הבנייה ובאזור Sea Breeze.'},\n  ],\n  [\n    {q:'מה זה אזור Sea Breeze?', a:'Sea Breeze הוא אזור החוף החדש והמבוקש ביותר בבאקו. פרויקט פיתוח ענק הכולל מלונות יוקרה, קזינו, אטרקציות ומגורים על קו החוף הראשון.'},\n    {q:'מה יש בקזינו של Sea Breeze?', a:'הקזינו הגדול באירופה נבנה במרחק 6 דקות הליכה מהפרויקט: 90,000 מ״ר, יותר מ-100 שולחנות משחק ו-1,500 מכונות משחק.'},\n    {q:'מתי צפוי האזור להיפתח במלואו?', a:'הפיתוח מתקדם בשלבים; חלקים מהתשתית והמתקנים כבר פועלים, וההשלמה המלאה של האזור צפויה בשנים הקרובות.'},\n    {q:'מה מבדל את Sea Breeze משאר אזורי באקו?', a:'מיקום ייחודי על החוף, השקעת ענק ממשלתית ופרטית, ותמהיל של תיירות, בילוי ומגורים באזור אחד.'},\n    {q:'מה יש באזור מעבר לקזינו?', a:'מלונות, מרינה, פארק מים, מסעדות, חופים מוסדרים, מגרשי ספורט ושטחי מסחר, הכל בתוך המתחם.'},\n    {q:'האם האזור פעיל כל השנה?', a:'כן. עונת הים מרוכזת בחודשים החמים, אך המלונות, הקזינו והמסחר פועלים לאורך כל השנה.'},\n    {q:'מי מפתח את Sea Breeze?', a:'האזור מפותח על ידי גוף יזמי גדול בליווי השקעות פרטיות וממשלתיות בהיקף של מיליארדי דולרים.'},\n    {q:'מה מרחק ההליכה מהפרויקט לחוף?', a:'הפרויקט בקו ראשון לים, דקות הליכה ספורות מהחוף, מהמרינה ומאזור המסחר.'},\n  ],\n  [\n    {q:'למה להשקיע בבאקו?', a:'באקו היא בירת אזרבייג׳ן ומרכז כלכלי צומח, עם השקעות תשתית בינלאומיות, תיירות גואה ושוק נדל״ן במגמת עלייה.'},\n    {q:'האם זרים יכולים לרכוש נדל״ן בבאקו?', a:'כן, החוק באזרבייג׳ן מאפשר לזרים לרכוש נכסי מגורים ללא מגבלות מיוחדות.'},\n    {q:'איך מגיעים לבאקו?', a:'לבאקו טיסות ישירות ממרבית ערי אירופה והמזרח התיכון, ושדה התעופה הבינלאומי נמצא כ-25 דקות מהעיר.'},\n    {q:'כמה זמן נסיעה מהפרויקט לשדה התעופה?', a:'כ-25 דקות נסיעה מ-Sea Breeze לשדה התעופה, וכ-20 דקות לעיר באקו.'},\n    {q:'האם יש טיסות ישירות מישראל?', a:'כן, מספר טיסות ישירות בשבוע, בטיסה של כשלוש שעות בלבד.'},\n    {q:'מה מצב המיסוי על נדל״ן באזרבייג׳ן?', a:'המיסוי על רכישה והחזקת נכסים נחשב נמוך יחסית לאירופה. אנחנו מחברים אתכם לייעוץ מקצועי בנושא.'},\n    {q:'באיזו מטבע מתבצעת העסקה?', a:'העסקאות מתבצעות בדולר אמריקאי או במנאט המקומי, בהתאם לתנאי ההסכם.'},\n    {q:'האם צריך להגיע לבאקו כדי לרכוש?', a:'לא חובה. ניתן להשלים את התהליך מרחוק בליווי משפטי ובייפוי כוח, אך אנחנו ממליצים על ביקור באתר.'},\n    {q:'איך מתנהלת התקשורת מול הרוכשים הישראלים?', a:'הליווי כולו בעברית, מהפגישה הראשונה ועד מסירת המפתח.'},\n  ],\n];\nconst LABELS = ['מיאמי רזידנס', 'Sea Breeze', 'באקו'];\n\nclass Component extends DCLogic {\n  state = { topic: 0, open: 0 , isMobile: false, menuOpen: false };\n  componentDidMount() {\n    this.checkMobileNav = () => {\n      const m = window.innerWidth < 900;\n      this.setState({ isMobile: m, narrow: m, menuOpen: m ? this.state.menuOpen : false });\n    };\n    this.checkMobileNav();\n    window.addEventListener('resize', this.checkMobileNav);\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this.checkMobileNav); }\n  toggleMenu = () => this.setState(st => ({ menuOpen: !st.menuOpen }));\n  renderVals() {\n    const { topic, open } = this.state;\n    return {\n      isMobile: this.state.isMobile,\n      isDesktop: !this.state.isMobile,\n      menuOpen: this.state.menuOpen,\n      toggleMenu: this.toggleMenu,\n      faqs: LISTS[topic].map((f, i) => ({\n        q: f.q, a: f.a,\n        open: open === i,\n        sign: open === i ? '\\u2212' : '+',\n        signBg: open === i ? '#7C3F43' : 'rgba(140,74,78,0.12)',\n        signColor: open === i ? '#FFFFFF' : '#8C4A4E',\n        toggle: () => this.setState({ open: open === i ? null : i }),\n      })),\n      topics: LABELS.map((label, i) => ({\n        label,\n        select: () => this.setState({ topic: i, open: 0 }),\n        bg: topic === i ? '#7C3F43' : 'transparent',\n        color: topic === i ? '#FFFFFF' : '#3A3436',\n        border: topic === i ? 'transparent' : 'rgba(140,74,78,0.3)',\n      })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
