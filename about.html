  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lor:rgba(233,192,188,0.45);\">02<\u002Fspan><\u002Fa>\n          <a href=\"media.html\" style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:19px 2px;border-bottom:1px solid rgba(255,255,255,0.09);color:#FFFFFF;font-size:23px;font-weight:500;letter-spacing:0.01em;\" style-hover=\"color:#E9C0BC;\"><span>מדיה<\u002Fspan><span style=\"font-size:11px;letter-spacing:0.18em;color:rgba(233,192,188,0.45);\">03<\u002Fspan><\u002Fa>\n          <a href=\"faq.html\" style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:19px 2px;border-bottom:1px solid rgba(255,255,255,0.09);color:#FFFFFF;font-size:23px;font-weight:500;letter-spacing:0.01em;\" style-hover=\"color:#E9C0BC;\"><span>שאלות ותשובות<\u002Fspan><span style=\"font-size:11px;letter-spacing:0.18em;color:rgba(233,192,188,0.45);\">04<\u002Fspan><\u002Fa>\n          <a href=\"contact.html\" style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:19px 2px;border-bottom:1px solid rgba(255,255,255,0.09);color:#FFFFFF;font-size:23px;font-weight:500;letter-spacing:0.01em;\" style-hover=\"color:#E9C0BC;\"><span>צור קשר<\u002Fspan><span style=\"font-size:11px;letter-spacing:0.18em;color:rgba(233,192,188,0.45);\">05<\u002Fspan><\u002Fa>\n        <\u002Fnav>\n        <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:14px;padding:26px 6% calc(26px + env(safe-area-inset-bottom));\">\n          <a href=\"https://wa.me/972508284019\" style=\"background:#7C3F43;color:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:700;letter-spacing:0.02em;padding:16px;border-radius:32px;\"><svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2.2-5.5A8.4 8.4 0 1 1 21 11.5z\"><\u002Fpath><\u002Fsvg><span>שלחו הודעה בוואטסאפ<\u002Fspan><\u002Fa>\n          <a href=\"tel:0508284019\" style=\"text-align:center;color:rgba(255,255,255,0.6);font-size:13.5px;letter-spacing:0.1em;\">050-828-4019<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"position:relative;isolation:isolate;min-height:clamp(400px,58vh,580px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(110px,20vw,150px) 6% clamp(56px,9vw,84px);overflow:hidden;\">\n    <img src=\"14993bf0-ff45-4128-b144-6e72f5f36c47\" alt=\"Miami Residence\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;\">\n    <div style=\"position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(14,11,12,0.62),rgba(14,11,12,0.72));\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(165,100,102,0.3),rgba(110,60,64,0.34));mix-blend-mode:multiply;\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px;\">\n      <div style=\"width:6px;height:6px;transform:rotate(45deg);background:#E9C0BC;\"><\u002Fdiv>\n      <div style=\"width:46px;height:1px;background:rgba(233,192,188,0.6);\"><\u002Fdiv>\n      <div style=\"color:#E9C0BC;letter-spacing:0.3em;font-size:12.5px;\">אודות<\u002Fdiv>\n      <div style=\"width:46px;height:1px;background:rgba(233,192,188,0.6);\"><\u002Fdiv>\n      <div style=\"width:6px;height:6px;transform:rotate(45deg);background:#E9C0BC;\"><\u002Fdiv>\n    <\u002Fdiv>\n    <h1 style=\"font-family:'FUP Golan',sans-serif;font-weight:500;font-size:clamp(32px,5.4vw,60px);line-height:1.12;color:#FFFFFF;margin:0;text-wrap:balance;\">הסיפור מאחורי הפרויקט<\u002Fh1>\n    <div style=\"font-family:'Parisienne',cursive;font-size:clamp(32px,4vw,48px);line-height:1.1;color:#E9C0BC;margin:8px 0 20px;\">Miami Residence<\u002Fdiv>\n    <p style=\"font-size:clamp(15px,1.6vw,18px);line-height:1.85;color:rgba(255,255,255,0.88);margin:0 auto;max-width:58ch;text-wrap:pretty;\">מי עומד מאחורי הפרויקט, איך הוא תוכנן, ומה מקבל מי שקונה כאן דירה. בלי סופרלטיבים, רק העובדות.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:#FFFFFF;padding:clamp(56px,10vw,110px) clamp(24px,6%,80px);\">\n    <div style=\"max-width:900px;margin:0 auto;text-align:center;\">\n      <div style=\"display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px;\">\n        <div style=\"width:38px;height:1px;background:rgba(140,74,78,0.5);\"><\u002Fdiv>\n        <div style=\"color:#8C4A4E;letter-spacing:0.3em;font-size:12px;\">נקודת המוצא<\u002Fdiv>\n        <div style=\"width:38px;height:1px;background:rgba(140,74,78,0.5);\"><\u002Fdiv>\n      <\u002Fdiv>\n      <h2 style=\"font-family:'FUP Golan',sans-serif;font-weight:500;font-size:clamp(28px,3.8vw,48px);line-height:1.18;color:#141414;margin:0 0 26px;text-wrap:balance;\">איך פרויקט ישראלי הגיע לחוף של באקו<\u002Fh2>\n      <p style=\"font-size:clamp(16px,1.7vw,19px);line-height:1.9;color:#3A3436;margin:0 0 18px;text-wrap:pretty;\">היזמות מאחורי Miami Residence התחילה משאלה פשוטה: איפה אפשר עוד לקנות דירה קו ראשון לים, במדינה יציבה, במחיר שנשמע הגיוני. התשובה הובילה לרצועת החוף החדשה של באקו: אזור Sea Breeze, שבו מדינה שלמה משקיעה מיליארדים בבניית עיר נופש מודרנית מאפס.<\u002Fp>\n      <p style=\"font-size:clamp(16px,1.7vw,19px);line-height:1.9;color:#3A3436;margin:0;text-wrap:pretty;\">מכאן והלאה זו הייתה עבודה של שנתיים: בחירת המגרש, תכנון אדריכלי שמתאים לקהל בינלאומי, וליווי משפטי מלא שמאפשר לרוכש ישראלי להתנהל בביטחון מול הרשויות המקומיות.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#F3ECE7;border-top:1px solid rgba(20,20,20,0.08);padding:clamp(56px,9vw,110px) clamp(24px,6%,80px);\">\n    <div style=\"max-width:1320px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:clamp(32px,4.5vw,72px);align-items:center;\">\n      <div style=\"text-align:{{ archAlign }};\">\n        <div style=\"display:flex;align-items:center;justify-content:{{ archJustify }};gap:14px;margin-bottom:18px;\">\n          <div style=\"width:38px;height:1px;background:rgba(140,74,78,0.5);\"><\u002Fdiv>\n          <div style=\"color:#8C4A4E;letter-spacing:0.3em;font-size:12px;\">שפה אדריכלית<\u002Fdiv>\n          <sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"width:38px;height:1px;background:rgba(140,74,78,0.5);\"><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <h2 style=\"font-family:'FUP Golan',sans-serif;font-weight:500;font-size:clamp(28px,3.8vw,48px);line-height:1.18;margin:0 0 26px;color:#141414;text-wrap:balance;\">קווים מעוגלים, ים בכל חזית<\u002Fh2>\n        <p style=\"font-size:17px;line-height:1.9;color:#4A4345;margin:0 auto 32px;max-width:52ch;text-wrap:pretty;\">הבניין תוכנן כך שכמעט כל דירה מקבלת חזית פתוחה לים. הקווים המעוגלים אינם קישוט. הם מה שמאפשר להרחיב מרפסות מבלי להסתיר את הדירה השכנה.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;border-top:1px solid rgba(20,20,20,0.1);text-align:start;\">\n          <sc-for list=\"{{ principles }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:18px;padding:16px 2px;border-bottom:1px solid rgba(20,20,20,0.1);\">\n              <div style=\"font-size:12px;letter-spacing:0.16em;color:#B5676B;\">{{ p.num }}<\u002Fdiv>\n              <div>\n                <div style=\"font-size:16.5px;color:#241F21;line-height:1.5;margin-bottom:4px;\">{{ p.title }}<\u002Fdiv>\n                <div style=\"font-size:14px;color:#6B6058;line-height:1.6;text-wrap:pretty;\">{{ p.text }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative;aspect-ratio:4/5;min-height:clamp(320px,44vw,620px);overflow:hidden;background:#101010;box-shadow:0 26px 60px rgba(20,20,20,0.16);\">\n        <img src=\"1e76c3c8-3aa8-4b3f-be4f-22a2b51145a5\" alt=\"אדריכלות הפרויקט\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;\">\n        <div style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.04) 50%,rgba(0,0,0,0.28));\"><\u002Fdiv>\n        <div style=\"position:absolute;inset:clamp(14px,1.8vw,22px);border:1px solid rgba(255,255,255,0.3);pointer-events:none;\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#FFFFFF;padding:clamp(56px,10vw,110px) clamp(24px,6%,80px);\">\n    <div style=\"text-align:center;max-width:760px;margin:0 auto 48px;\">\n      <div style=\"display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px;\">\n        <div style=\"width:38px;height:1px;background:rgba(140,74,78,0.5);\"><\u002Fdiv>\n        <div style=\"color:#8C4A4E;letter-spacing:0.3em;font-size:12px;\">לוח זמנים<\u002Fdiv>\n        <div style=\"width:38px;height:1px;background:rgba(140,74,78,0.5);\"><\u002Fdiv>\n      <\u002Fdiv>\n      <h2 style=\"font-family:'FUP Golan',sans-serif;font-weight:500;font-size:clamp(28px,3.8vw,46px);color:#141414;margin:0 0 14px;text-wrap:balance;\">איפה הפרויקט עומד היום<\u002Fh2>\n      <p style=\"color:#6B6058;font-size:15.5px;line-height:1.8;margin:0;\">שקיפות מלאה על השלב שבו נמצאת הבנייה.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"max-width:1100px;margin:0 auto;display:grid;grid-template-columns:{{ phasesCols }};gap:clamp(14px,2vw,20px);\">\n      <sc-for list=\"{{ phases }}\" as=\"ph\" hint-placeholder-count=\"4\">\n        <div style=\"border:1px solid {{ ph.border }};background:{{ ph.bg }};padding:clamp(24px,3vw,32px) clamp(18px,2vw,24px);display:flex;flex-direction:column;gap:10px;\">\n          <div style=\"display:flex;align-items:center;gap:10px;\">\n            <div style=\"width:8px;height:8px;border-radius:50%;background:{{ ph.dot }};\"><\u002Fdiv>\n            <div style=\"font-size:12px;letter-spacing:0.16em;color:{{ ph.stageColor }};\">{{ ph.stage }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:'FUP Golan',sans-serif;font-size:19px;font-weight:500;color:{{ ph.titleColor }};line-height:1.3;\">{{ ph.title }}<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.65;color:{{ ph.textColor }};text-wrap:pretty;\">{{ ph.text }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#512A2D;padding:clamp(56px,9vw,110px) clamp(24px,6%,80px);\">\n    <div style=\"max-width:1100px;margin:0 auto;text-align:center;\">\n      <div style=\"color:#E9C0BC;letter-spacing:0.3em;font-size:12px;margin-bottom:16px;\">איך אנחנו עובדים<\u002Fdiv>\n      <h2 style=\"font-family:'FUP Golan',sans-serif;font-weight:500;font-size:clamp(28px,3.8vw,46px);color:#FFFFFF;margin:0 0 44px;text-wrap:balance;\">ליווי מלא, מהשיחה הראשונה ועד המפתח<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:{{ servicesCols }};gap:clamp(20px,3vw,40px);text-align:center;\">\n        <sc-for list=\"{{ services }}\" as=\"sv\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;flex-direction:column;gap:14px;align-items:center;padding:0 clamp(4px,1vw,12px);\">\n            <div style=\"width:70px;height:70px;border-radius:50%;border:1px solid rgba(233,192,188,0.45);background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.35s ease,transform 0.35s ease;\" style-hover=\"background:rgba(255,255,255,0.13);transform:translateY(-4px);\">\n              <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E9C0BC\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ sv.icon }}\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n            <div style=\"font-family:'FUP Golan',sans-serif;font-size:18.5px;font-weight:500;color:#FFFFFF;line-height:1.35;\">{{ sv.title }}<\u002Fdiv>\n            <div style=\"width:24px;height:1px;background:rgba(233,192,188,0.55);\"><\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.75;color:rgba(255,255,255,0.7);max-width:26ch;text-wrap:pretty;\">{{ sv.text }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#FFFFFF;border-top:1px solid rgba(20,20,20,0.08);padding:clamp(48px,8vw,84px) 6%;text-align:center;\">\n    <h2 style=\"font-family:'FUP Golan',sans-serif;font-weight:500;font-size:clamp(24px,3.2vw,40px);color:#141414;margin:0 0 14px;text-wrap:balance;\">רוצים לשמוע את כל הפרטים?<\u002Fh2>\n    <p style=\"color:#4A4345;font-size:15.5px;line-height:1.8;margin:0 auto 28px;max-width:52ch;\">נשמח לעבור אתכם על התוכניות, המחירים ולוחות הזמנים, בשיחה אחת.<\u002Fp>\n    <a href=\"contact.html\" style=\"display:inline-block;background:#7C3F43;color:#FFFFFF;padding:15px 36px;font-size:14.5px;font-weight:700;letter-spacing:0.04em;border-radius:26px;\">דברו איתנו<\u002Fa>\n  <\u002Fdiv>\n\n  <div style=\"background:#0A0A0A;padding:50px 6% 34px;display:flex;flex-direction:column;align-items:center;gap:22px;border-top:1px solid rgba(181,103,107,0.2);\">\n    <img src=\"84710fa6-f957-43fd-bd5f-ce6401f193fd\" alt=\"Miami Residence\" style=\"height:30px;width:auto;object-fit:contain;display:block;\">\n    <div style=\"display:flex;gap:8px 24px;flex-wrap:wrap;justify-content:center;\">\n      <a href=\"index.html\" style=\"color:#9C8688;font-size:13px;padding:8px 4px;\">בית<\u002Fa>\n      <a href=\"about.html\" style=\"color:#9C8688;font-size:13px;padding:8px 4px;\">אודות<\u002Fa>\n      <a href=\"media.html\" style=\"color:#9C8688;font-size:13px;padding:8px 4px;\">מדיה<\u002Fa>\n      <a href=\"faq.html\" style=\"color:#9C8688;font-size:13px;padding:8px 4px;\">שאלות ותשובות<\u002Fa>\n      <a href=\"contact.html\" style=\"color:#9C8688;font-size:13px;padding:8px 4px;\">צור קשר<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;color:#5E574C;\">© מיאמי רזידנס · Sea Breeze, Baku. כל הזכויות שמורות.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { narrow: false , isMobile: false, menuOpen: false };\n  componentDidMount() {\n    this.checkMobileNav = () => {\n      const m = window.innerWidth < 900;\n      this.setState({ isMobile: m, narrow: m, menuOpen: m ? this.state.menuOpen : false });\n    };\n    this.checkMobileNav();\n    window.addEventListener('resize', this.checkMobileNav);\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this.checkMobileNav); }\n  toggleMenu = () => this.setState(st => ({ menuOpen: !st.menuOpen }));\n  renderVals() {\n    const done = {bg:'#F3ECE7', border:'rgba(140,74,78,0.2)', dot:'#7C3F43', stageColor:'#8C4A4E', titleColor:'#141414', textColor:'#4A4345'};\n    const now = {bg:'#7C3F43', border:'#7C3F43', dot:'#FFFFFF', stageColor:'rgba(255,255,255,0.75)', titleColor:'#FFFFFF', textColor:'rgba(255,255,255,0.8)'};\n    const next = {bg:'#FFFFFF', border:'rgba(20,20,20,0.12)', dot:'rgba(140,74,78,0.35)', stageColor:'#8C7A7C', titleColor:'#141414', textColor:'#6B6058'};\n    return {\n      isMobile: this.state.isMobile,\n      isDesktop: !this.state.isMobile,\n      menuOpen: this.state.menuOpen,\n      toggleMenu: this.toggleMenu,\n      archAlign: this.state.narrow ? 'center' : 'start',\n      archJustify: this.state.narrow ? 'center' : 'flex-start',\n      servicesCols: this.state.narrow ? 'repeat(2,1fr)' : 'repeat(4,1fr)',\n      phasesCols: this.state.narrow ? 'repeat(2,1fr)' : 'repeat(4,1fr)',\n      principles: [\n        {num:'01', title:'חזית פתוחה לים', text:'רוב הדירות עם מרפסת פרונטלית וקו ראייה ישיר למים.'},\n        {num:'02', title:'קומת קרקע חיה', text:'מסחר, בתי קפה ולובי מאויש, במקום חזית אטומה לרחוב.'},\n        {num:'03', title:'חומרים לאקלים ימי', text:'גימורים ואלומיניום שנבחרו לעמידות מול מליחות ורוח.'},\n        {num:'04', title:'פרטיות בין הבניינים', text:'מיקום המבנים תוכנן כך שאף מרפסת לא מביטה ישירות לשכנה.'},\n      ],\n      phases: [\n        Object.assign({stage:'הושלם', title:'רכישת הקרקע ותכנון', text:'איתור המגרש בקו הראשון, אישור התוכניות והיתרי הבנייה.'}, done),\n        Object.assign({stage:'הושלם', title:'עבודות עפר ויסודות', text:'ביסוס המבנה והכנת התשתיות במגרש.'}, done),\n        Object.assign({stage:'בביצוע', title:'בניית השלד', text:'הקומות עולות בקצב מתוכנן; עדכוני התקדמות נשלחים לרוכשים.'}, now),\n        Object.assign({stage:'בהמשך', title:'מערכות, גמר ומסירה', text:'התקנת מערכות, עבודות גמר ומסירת דירות לפי לוח הזמנים בהסכם.'}, next),\n      ],\n      services: [\n        {title:'ייעוץ לפני רכישה', text:'מעבר על טיפוסי הדירות, קומות, כיווני אוויר ותמחור, בלי התחייבות.', icon:'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'},\n        {title:'ליווי משפטי', text:'עורכי דין מקומיים וישראלים מלווים את ההסכם ואת רישום הזכויות.', icon:'M12 3v18M5 7h14M7 7l-3 7a3.5 3.5 0 0 0 6 0zM17 7l-3 7a3.5 3.5 0 0 0 6 0z'},\n        {title:'העברות כספים', text:'הכוונה מלאה בתהליך התשלומים הבינלאומי מול הבנקים.', icon:'M3 10h18M3 10l9-6 9 6M5 10v8M19 10v8M9 10v8M15 10v8M3 20h18'},\n        {title:'ניהול השכרה', text:'למשקיעים: חיבור לחברות ניהול מקומיות להשכרה קצרה או ארוכה.', icon:'M3 11l9-7 9 7M6 10v10h12V10M10 20v-6h4v6'},\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
